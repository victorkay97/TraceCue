name: TraceCue checks
on:
  push:
    branches: [main, feat/tracecue-foundation]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension scripts
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/offscreen.js
          node --check extension/viewer.js
          node --check extension/sidepanel.js
          node --check extension/companion.js
          node --check extension/clipper.js
          node --check extension/clip-viewer.js
          node --check studio/src/synchronized-video.js
          node --check studio/src/repro-audit.js
      - name: Run evidence processing tests
        run: npm test
      - name: Install Studio dependencies
        run: npm --prefix studio install --no-audit --no-fund
      - name: Build Studio
        run: npm --prefix studio run build
